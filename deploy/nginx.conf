# HTTPS 리버스 프록시 예시 (KDS 실시간 연결을 위해 WebSocket 업그레이드 필수)
server {
  listen 443 ssl http2;
  server_name mps.example.com;
  ssl_certificate     /etc/letsencrypt/live/mps.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mps.example.com/privkey.pem;

  client_max_body_size 4m;

  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name mps.example.com;
  return 301 https://$host$request_uri;
}
